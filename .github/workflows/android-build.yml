name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AGENTX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-release-key.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build PRoot native runtime (arm64-v8a)
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          sh tools/ubuntu-runtime/build-proot.sh arm64-v8a out/artifacts
          cat out/artifacts/BUILDINFO
          cat out/artifacts/SHA256SUMS

      - name: Verify native artifacts
        run: sh tools/ubuntu-runtime/verify-native.sh arm64-v8a out/artifacts

      - name: Vendor native runtime into jniLibs
        run: sh tools/ubuntu-runtime/vendor-native.sh arm64-v8a out/artifacts ubuntu-runtime/src/main/jniLibs

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        env:
          AGENTX_STORE_FILE: ${{ runner.temp }}/my-release-key.jks
          AGENTX_KEY_ALIAS: ${{ secrets.AGENTX_KEY_ALIAS }}
          AGENTX_STORE_PASSWORD: ${{ secrets.AGENTX_STORE_PASSWORD }}
          AGENTX_KEY_PASSWORD: ${{ secrets.AGENTX_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Verify APK contains ARM64 PRoot libraries
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK=$APK"
          sh tools/ubuntu-runtime/verify-apk.sh "$APK" arm64-v8a

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentx-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload native runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentx-native-runtime-arm64-v8a
          path: out/artifacts/*
          retention-days: 7
