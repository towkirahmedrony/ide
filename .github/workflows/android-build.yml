name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AGENTX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-release-key.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Vendor native developer runtime
        # Downloads the pinned PRoot runtime (see .github/workflows/build-native-runtime.yml)
        # into the module's jniLibs, so the APK packages it into nativeLibraryDir.
        #
        # Tolerant on purpose: until that workflow has published a release, the APK still
        # builds, and at runtime the developer runtime reports its native components as missing
        # rather than the build failing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ubuntu-runtime/src/main/jniLibs/arm64-v8a
          gh release download agentx-native-runtime-2026.10.01-r1 \
            --pattern '*.so' --dir /tmp/agentx-native \
            || echo "::warning::native developer runtime release not published yet"
          if [ -d /tmp/agentx-native ]; then
            cp /tmp/agentx-native/*.so ubuntu-runtime/src/main/jniLibs/arm64-v8a/ || true
          fi
          ls -l ubuntu-runtime/src/main/jniLibs/arm64-v8a || true

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        env:
          AGENTX_STORE_FILE: ${{ runner.temp }}/my-release-key.jks
          AGENTX_KEY_ALIAS: ${{ secrets.AGENTX_KEY_ALIAS }}
          AGENTX_STORE_PASSWORD: ${{ secrets.AGENTX_STORE_PASSWORD }}
          AGENTX_KEY_PASSWORD: ${{ secrets.AGENTX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentx-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
