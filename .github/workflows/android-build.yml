name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AGENTX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-release-key.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        env:
          AGENTX_STORE_FILE: ${{ runner.temp }}/my-release-key.jks
          AGENTX_KEY_ALIAS: ${{ secrets.AGENTX_KEY_ALIAS }}
          AGENTX_STORE_PASSWORD: ${{ secrets.AGENTX_STORE_PASSWORD }}
          AGENTX_KEY_PASSWORD: ${{ secrets.AGENTX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pagentx.termux.officialPrefix=true --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentx-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
